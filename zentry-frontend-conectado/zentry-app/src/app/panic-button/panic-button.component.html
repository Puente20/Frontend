<div
  *ngIf="isOpen"
  class="panic-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="panic-alert-title"
  aria-describedby="panic-alert-description"
  (click)="onOverlayClick($event)">

  <div class="panic-modal-content">
    <!-- Círculo principal de alerta -->
    <div class="panic-alert-circle">
      <svg
        class="warning-icon"
        viewBox="0 0 64 58"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <path
          d="M27.66 4.5C29.59 1.17 34.41 1.17 36.34 4.5L60.59 46.5C62.52 49.83 60.11 54 56.25 54H7.75C3.89 54 1.48 49.83 3.41 46.5L27.66 4.5Z"
          fill="#FFFFFF" />
        <line
          x1="32"
          y1="19"
          x2="32"
          y2="35"
          stroke="#FF0000"
          stroke-width="5"
          stroke-linecap="round" />
        <circle cx="32" cy="44.5" r="3" fill="#FF0000" />
      </svg>

      <h2 id="panic-alert-title" class="alert-title">¡Alerta de emergencia!</h2>

      <div class="alert-divider" aria-hidden="true"></div>

      <p id="panic-alert-description" class="alert-description">
        Al confirmar se enviará una<br />
        notificación inmediata a<br />
        Seguridad y se activará el<br />
        protocolo de respuesta
      </p>
    </div>

    <!-- Botones de acción -->
    <div class="panic-actions">
      <button
        type="button"
        class="btn-panic-action btn-rechazar"
        (click)="onRechazar()">
        <svg
          class="action-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M18 6L6 18M6 6L18 18"
            stroke="#FF0000"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span>Rechazar</span>
      </button>

      <button
        type="button"
        class="btn-panic-action btn-confirmar"
        (click)="onConfirmar()" [disabled]="enviando">
        <svg
          class="action-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M20 6L9 17L4 12"
            stroke="#FFFFFF"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span>Confirmar</span>
      </button>
    </div>
    <p *ngIf="errorMensaje" role="alert" class="error-emergencia">{{ errorMensaje }}</p>
  </div>
</div>
