<div class="admin-wrapper">

  <!--Encabezado de Perfil de Admin -->
  <header class="profile-header">
    <div class="avatar-circle">
      <img src="/minilogo-sfondo.png" alt="Logo Zentry" class="avatar-img" />
    </div>
    <div class="profile-info">
      <h2 class="admin-name">{{ adminNombre }}</h2>
      <p class="admin-role">{{ adminRol }}</p>
    </div>
  </header>

  <!-- Título Principal y Fecha / Barrio -->
  <section class="panel-heading">
    <h1 class="panel-title">Panel de gestión</h1>
    <p class="panel-subtitle">
      Fecha, {{ fechaActual }} - <em>{{ nombreBarrio }}</em>
    </p>
  </section>

  <!-- 3. Tarjetas de Acciones Principales -->
  <main class="cards-list" *ngIf="tabActiva === 'inicio'">

    <!-- Tarjeta 1: Alta de residentes -->
    <button type="button" class="management-card" (click)="seleccionarAccion('alta')">

      </div>
      <div class="card-content">
        <h3 class="card-title">Alta de residentes</h3>
        <p class="card-description">Regístrar nuevo inquilino/<br>propietario y asignar lote.</p>
      </div>
    </button>

    <!-- Tarjeta 2: Editar residentes -->
    <button type="button" class="management-card" (click)="seleccionarAccion('editar')">
      <div class="card-icon-box">
        <svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">

      </div>
      <div class="card-content">
        <h3 class="card-title">Editar residentes</h3>
        <p class="card-description">Ver, buscar y modificar datos.</p>
      </div>
    </button>

    <!-- Tarjeta 3: Historial -->
    <button type="button" class="management-card" (click)="seleccionarAccion('historial')">

      </div>
      <div class="card-content">
        <h3 class="card-title">Historial</h3>
        <p class="card-description">Descargar histórico de ingresos<br>y egresos.</p>
      </div>
    </button>
    <!-- 4 Opcion Creación de guardia-->
  <button type="button" class="management-card" (click)="seleccionarAccion('guardia')">
    <div class="card-icon-box">
      <svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">

</svg>
    </div>
    <div class="card-content">
      <h3 class="card-title">Dar de alta a guardia</h3>
      <p class="card-description">Registrar nuevo guardia para el barrio</p>
    </div>
  </button>

  <button type="button" class="management-card" (click)="seleccionarAccion('administrador')">
    <div class="card-icon-box">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2.5 20v-1.5A5.5 5.5 0 0 1 8 13h2a5.5 5.5 0 0 1 5.5 5.5V20H2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M19 7v6m-3-3h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card-content">
      <h3 class="card-title">Dar de alta administrador</h3>
      <p class="card-description">Registrar un nuevo administrador del barrio.</p>
    </div>
  </button>
  </main>

  <!-- Vista secundaria opcional para Perfil / Ajustes -->
  <section class="secondary-view" *ngIf="tabActiva === 'perfil'">
    <div class="management-card secondary-card">
      <div class="card-content">
        <h3 class="card-title">{{ adminNombre }}</h3>
        <p class="card-description">Rol: {{ adminRol }} · {{ nombreBarrio }}</p>
        <button type="button" class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </section>

  <section class="secondary-view" *ngIf="tabActiva === 'ajustes'">
    <div class="management-card secondary-card">
      <div class="card-content">
        <h3 class="card-title">Configuración del panel</h3>
        <p class="card-description">Preferencias del sistema y control de acceso.</p>
        <button type="button" class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </section>

  <!-- 4. Barra de Navegación Inferior -->
  <nav class="bottom-nav-container" aria-label="Navegación principal">
    <div class="bottom-nav">

      <!-- Inicio -->
      <button
        type="button"
        class="nav-item"
        [class.active]="tabActiva === 'inicio'"
        (click)="cambiarTab('inicio')"
        aria-label="Inicio">
        <span class="nav-notch" *ngIf="tabActiva === 'inicio'"></span>
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3.2L3 10.8V20.2C3 20.64 3.36 21 3.8 21H9.5V14.5H14.5V21H20.2C20.64 21 21 20.64 21 20.2V10.8L12 3.2Z"/>
          </svg>
        </span>
      </button>

      <!-- Residentes -->
      <button
        type="button"
        class="nav-item"
        [class.active]="tabActiva === 'perfil'"
        (click)="cambiarTab('perfil')"
        aria-label="Editar residentes">
        <span class="nav-notch" *ngIf="tabActiva === 'perfil'"></span>
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="7.5" r="4.2"/>
            <path d="M4.5 20.2C4.5 16.2 7.8 13.5 12 13.5C16.2 13.5 19.5 16.2 19.5 20.2H4.5Z"/>
          </svg>
        </span>
      </button>

      <!-- Ajustes -->
      <button
        type="button"
        class="nav-item"
        [class.active]="tabActiva === 'ajustes'"
        (click)="cambiarTab('ajustes')"
        aria-label="Configuración">
        <span class="nav-notch" *ngIf="tabActiva === 'ajustes'"></span>
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.4 2.2C10.6 1.7 11.1 1.4 11.6 1.4H12.4C12.9 1.4 13.4 1.7 13.6 2.2L14.2 3.8C14.8 4.0 15.3 4.3 15.8 4.7L17.5 4.1C18.0 3.9 18.5 4.1 18.8 4.5L19.4 5.2C19.7 5.6 19.8 6.2 19.5 6.6L18.5 8.1C18.8 8.6 19.0 9.2 19.1 9.8L20.7 10.4C21.2 10.6 21.5 11.1 21.5 11.6V12.4C21.5 12.9 21.2 13.4 20.7 13.6L19.1 14.2C19.0 14.8 18.8 15.4 18.5 15.9L19.5 17.4C19.8 17.8 19.7 18.4 19.4 18.8L18.8 19.5C18.5 19.9 18.0 20.1 17.5 19.9L15.8 19.3C15.3 19.7 14.8 20.0 14.2 20.2L13.6 21.8C13.4 22.3 12.9 22.6 12.4 22.6H11.6C11.1 22.6 10.6 22.3 10.4 21.8L9.8 20.2C9.2 20.0 8.7 19.7 8.2 19.3L6.5 19.9C6.0 20.1 5.5 19.9 5.2 19.5L4.6 18.8C4.3 18.4 4.2 17.8 4.5 17.4L5.5 15.9C5.2 15.4 5.0 14.8 4.9 14.2L3.3 13.6C2.8 13.4 2.5 12.9 2.5 12.4V11.6C2.5 11.1 2.8 10.6 3.3 10.4L4.9 9.8C5.0 9.2 5.2 8.6 5.5 8.1L4.5 6.6C4.2 6.2 4.3 5.6 4.6 5.2L5.2 4.5C5.5 4.1 6.0 3.9 6.5 4.1L8.2 4.7C8.7 4.3 9.2 4.0 9.8 3.8L10.4 2.2ZM12 15.2C13.77 15.2 15.2 13.77 15.2 12C15.2 10.23 13.77 8.8 12 8.8C10.23 8.8 8.8 10.23 8.8 12C8.8 13.77 10.23 15.2 12 15.2Z"/>

      </button>

    </div>
  </nav>

</div>
