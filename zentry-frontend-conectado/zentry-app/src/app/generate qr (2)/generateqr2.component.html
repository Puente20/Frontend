<main class="screen-container">
  <header class="header">
    <button type="button" class="btn-back" (click)="volver()" aria-label="Volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <img src="/logo-zentry-negro.png" alt="Zentry" class="zentry-logo" />
  </header>

  <section class="title-section">
    <h1 class="main-title">Generar QR de invitación</h1>
    <p class="subtitle-date">Fecha, {{ fechaActual }}</p>
  </section>

  <section class="type-section" aria-labelledby="invitation-type-label">
    <h2 id="invitation-type-label" class="section-label">Tipo de invitación</h2>
    <div class="toggle-pill" [class.is-concurrent]="tipoInvitacion === 'concurrente'">
      <button
        type="button"
        class="toggle-option"
        [class.active]="tipoInvitacion === 'unica'"
        (click)="seleccionarTipo('unica')">
        Visita única
      </button>
      <button
        type="button"
        class="toggle-option"
        [class.active]="tipoInvitacion === 'concurrente'"
        (click)="seleccionarTipo('concurrente')">
        Visita recurrente
      </button>
    </div>
  </section>

  <form class="invitation-form" (ngSubmit)="generarQR()">
    <fieldset class="weekdays" aria-label="Días habilitados">
      <div class="weekday-row weekday-row-top">
        <label class="weekday-option" *ngFor="let dia of diasFilaSuperior">
          <input type="checkbox" [checked]="diasSeleccionados.includes(dia.valor)" (change)="cambiarDia(dia.valor, $event)" />
          <span>{{ dia.etiqueta }}</span>
        </label>
      </div>
      <div class="weekday-row weekday-row-bottom">
        <label class="weekday-option" *ngFor="let dia of diasFilaInferior">
          <input type="checkbox" [checked]="diasSeleccionados.includes(dia.valor)" (change)="cambiarDia(dia.valor, $event)" />
          <span>{{ dia.etiqueta }}</span>
        </label>
      </div>
    </fieldset>

    <section class="form-card" aria-label="Datos de la invitación">
      <div class="form-group">
        <label for="nombreVisitante" class="input-label">Nombre del visitante</label>
        <div class="input-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M17.925 20.056C17.7006 18.6458 16.9805 17.3619 15.8944 16.435C14.8082 15.5081 13.427 14.999 11.9991 14.9991C10.5711 14.9992 9.19007 15.5086 8.10403 16.4357C7.018 17.3628 6.2982 18.6468 6.074 20.057M16 11C16 13.2091 14.2091 15 12 15C9.79086 15 8 13.2091 8 11C8 8.79086 9.79086 7 12 7C14.2091 7 16 8.79086 16 11ZM22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="black"/>
</svg>

          <input
            id="nombreVisitante"
            name="nombreVisitante"
            type="text"
            class="form-input"
            placeholder="Ej: Juan Martinez"
            [(ngModel)]="invitacion.nombreVisitante"
            required />
        </div>
      </div>

      <div class="form-group date-field">
        <label for="dni" class="input-label">Documento Nacional de Identidad</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <circle cx="8" cy="10" r="2"></circle>
            <path d="M5 16c0-1.7 1.3-3 3-3s3 1.3 3 3"></path>
            <line x1="14" y1="10" x2="19" y2="10"></line>
            <line x1="14" y1="14" x2="19" y2="14"></line>
          </svg>
          <input
            id="dni"
            name="dni"
            type="text"
            inputmode="numeric"
            class="form-input"
            placeholder="Ej: 32456789"
            [(ngModel)]="invitacion.dni"
            required />
        </div>
      </div>

      <div class="date-row">
        <div class="form-group date-field">
          <label for="fechaInicio" class="input-label">Fecha de inicio</label>
          <div class="date-input-wrapper">
            <input
              id="fechaInicio"
              name="fechaInicio"
              type="text"
              class="form-input date-input"
              placeholder="dd/mm/aaaa"
              inputmode="numeric"
              maxlength="10"
              [ngModel]="fechaInicioTexto"
              (ngModelChange)="actualizarFecha('inicio', $event)"
              required />
            <button
              type="button"
              class="calendar-button"
              aria-label="Elegir fecha de inicio"
              aria-controls="calendar-start"
              [attr.aria-expanded]="calendarioAbierto === 'inicio'"
              (click)="abrirCalendario('inicio')">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <line x1="16" y1="3" x2="16" y2="7"></line>
                <line x1="8" y1="3" x2="8" y2="7"></line>
                <line x1="3" y1="11" x2="21" y2="11"></line>
              </svg>
            </button>
            <section *ngIf="calendarioAbierto === 'inicio'" id="calendar-start" class="calendar-popup" role="dialog" aria-label="Calendario de fecha de inicio">
              <header class="calendar-header">
                <button type="button" class="calendar-nav" aria-label="Mes anterior" [disabled]="mesAnteriorDeshabilitado()" (click)="cambiarMes(-1)">
                  <span aria-hidden="true">‹</span>
                </button>
                <h3>{{ tituloMesVisible }}</h3>
                <button type="button" class="calendar-nav" aria-label="Mes siguiente" [disabled]="mesSiguienteDeshabilitado()" (click)="cambiarMes(1)">
                  <span aria-hidden="true">›</span>
                </button>
              </header>
              <div class="calendar-grid">
                <span class="calendar-weekday" *ngFor="let dia of calendarioDias">{{ dia }}</span>
                <button
                  *ngFor="let dia of diasDelCalendario"
                  type="button"
                  class="calendar-day"
                  [class.outside-month]="!dia.mesActual"
                  [class.today]="dia.hoy"
                  [class.selected]="dia.seleccionado"
                  [disabled]="dia.deshabilitado"
                  [attr.aria-pressed]="dia.seleccionado"
                  (click)="seleccionarDia(dia.fecha)">
                  {{ dia.numero }}
                </button>
              </div>
              <p class="calendar-hint">Selecciona una fecha de inicio</p>
            </section>
          </div>
        </div>

        <div class="form-group date-field">
          <label for="fechaFin" class="input-label">Fecha de fin</label>
          <div class="date-input-wrapper">
            <input
              id="fechaFin"
              name="fechaFin"
              type="text"
              class="form-input date-input"
              placeholder="dd/mm/aaaa"
              inputmode="numeric"
              maxlength="10"
              [ngModel]="fechaFinTexto"
              (ngModelChange)="actualizarFecha('fin', $event)"
              required />
            <button
              type="button"
              class="calendar-button"
              aria-label="Elegir fecha de fin"
              aria-controls="calendar-end"
              [attr.aria-expanded]="calendarioAbierto === 'fin'"
              (click)="abrirCalendario('fin')">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <line x1="16" y1="3" x2="16" y2="7"></line>
                <line x1="8" y1="3" x2="8" y2="7"></line>
                <line x1="3" y1="11" x2="21" y2="11"></line>
              </svg>
            </button>
            <section *ngIf="calendarioAbierto === 'fin'" id="calendar-end" class="calendar-popup" role="dialog" aria-label="Calendario de fecha de fin">
              <header class="calendar-header">
                <button type="button" class="calendar-nav" aria-label="Mes anterior" [disabled]="mesAnteriorDeshabilitado()" (click)="cambiarMes(-1)">
                  <span aria-hidden="true">‹</span>
                </button>
                <h3>{{ tituloMesVisible }}</h3>
                <button type="button" class="calendar-nav" aria-label="Mes siguiente" [disabled]="mesSiguienteDeshabilitado()" (click)="cambiarMes(1)">
                  <span aria-hidden="true">›</span>
                </button>
              </header>
              <div class="calendar-grid">
                <span class="calendar-weekday" *ngFor="let dia of calendarioDias">{{ dia }}</span>
                <button
                  *ngFor="let dia of diasDelCalendario"
                  type="button"
                  class="calendar-day"
                  [class.outside-month]="!dia.mesActual"
                  [class.today]="dia.hoy"
                  [class.selected]="dia.seleccionado"
                  [disabled]="dia.deshabilitado"
                  [attr.aria-pressed]="dia.seleccionado"
                  (click)="seleccionarDia(dia.fecha)">
                  {{ dia.numero }}
                </button>
              </div>
              <p class="calendar-hint">Selecciona una fecha de fin</p>
            </section>
          </div>
        </div>
      </div>
    </section>

    <p class="form-error" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>
    <button type="submit" class="btn-generar" [disabled]="generando">
      {{ generando ? 'Generando…' : 'Generar QR' }}
    </button>
  </form>
</main>
