<div class="login-wrapper">
  
  <!-- 1. Logo Principal Superior -->
  <div class="header-logo">
    <img src="/logo-zentry-negro.png" alt="Zentry Logo" class="main-logo-img" />
  </div>

  <!-- 2. Selección de rol -->
  <div class="role-selector">
    <button
      type="button"
      class="role-option"
      [class.active]="rolSeleccionado === 'administrador'"
      [attr.aria-pressed]="rolSeleccionado === 'administrador'"
      (click)="cambiarRol('administrador')">
      Administrador
    </button>

    <button
      type="button"
      class="role-option"
      [class.active]="rolSeleccionado === 'residente'"
      [attr.aria-pressed]="rolSeleccionado === 'residente'"
      (click)="cambiarRol('residente')">
      Residente
    </button>

    <button
      type="button"
      class="role-option"
      [class.active]="rolSeleccionado === 'guardia'"
      [attr.aria-pressed]="rolSeleccionado === 'guardia'"
      (click)="cambiarRol('guardia')">
      Guardia
    </button>
  </div>

  <!-- 3. Formulario de ingreso -->
  <form class="login-form" (ngSubmit)="iniciarSesion()">
    
    <!-- Campo Usuario / Email -->
    <div class="form-group">
      <label for="identificador">
        {{ rolSeleccionado === 'residente' ? 'Email de residente' : rolSeleccionado === 'administrador' ? 'Email de administrador' : 'ID de guardia o email' }}
      </label>
      <div class="input-row">
        <div class="input-box">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="9" r="3"/>
            <path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.834 2.855"/>
          </svg>
          <input 
            type="text" 
            id="identificador"
            name="identificador"
            [(ngModel)]="identificador"
            (ngModelChange)="limpiarError()"
            placeholder="ejemplo@gmail.com" 
            required
          />
        </div>
      </div>
    </div>

    <!-- Campo Contraseña -->
    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="input-row">
        <div class="input-box">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="11" width="16" height="10" rx="2" ry="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            id="password"
            name="password"
            [(ngModel)]="password"
            (ngModelChange)="limpiarError()"
            placeholder="***********" 
            required
          />
        </div>

        <button type="button" class="eye-btn" (click)="ojoContra()">
          <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 4. Botón Iniciar Sesión y enlace de contraseña -->
    <div class="actions-group">
      <p *ngIf="errorMensaje" class="login-error" role="alert" aria-live="polite">{{ errorMensaje }}</p>
      <button type="submit" class="btn-submit" [disabled]="enviando">
        {{ enviando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
      <a routerLink="/recu-contrasena" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

  </form>

  <!-- 5. Logo Circular Inferior -->
  <div class="footer-logo">
    <img src="/minilogo-sfondo.png" alt="Zentry Icono" class="bottom-logo-img" />
  </div>

</div>
