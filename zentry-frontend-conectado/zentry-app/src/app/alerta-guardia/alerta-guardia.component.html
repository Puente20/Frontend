<p *ngIf="sinConexion" class="alerta-conexion" role="alert">
  No se pueden consultar las emergencias. Revisá la conexión con el servidor.
</p>

<!-- Se abre directamente, sin una pantalla adicional de detalle. -->
<div *ngIf="alerta as emergencia" class="alerta-overlay">
  <section class="alerta-popup alerta-popup-emergencia" role="alertdialog" aria-modal="true"
           aria-labelledby="alerta-titulo">
    <div class="alerta-simbolo" aria-hidden="true">!</div>
    <h2 id="alerta-titulo">¡EMERGENCIA!</h2>
    <p class="alerta-prioridad">ALERTA DE SEGURIDAD · ATENCIÓN INMEDIATA</p>

    <div class="alerta-datos">
      <p><strong>Socio:</strong> {{ emergencia.nombre_completo }}</p>
      <p><strong>Lote:</strong> {{ emergencia.numero_lote }}</p>
      <p><strong>Teléfono:</strong>
        <a [href]="'tel:' + emergencia.telefono">{{ emergencia.telefono }}</a>
      </p>
    </div>

    <p *ngIf="error" class="alerta-error" role="alert">{{ error }}</p>

    <div class="alerta-acciones">
      <button type="button" class="boton-movil" [disabled]="enviando"
              (click)="resolver('enviar_movil')">
        {{ enviando ? 'Procesando...' : 'Enviar móvil' }}
      </button>
      <button type="button" class="boton-rechazar" [disabled]="enviando"
              (click)="resolver('rechazar')">
        Rechazar
      </button>
    </div>
  </section>
</div>

<div *ngIf="resultado" class="alerta-overlay">
  <section class="alerta-popup" role="dialog" aria-modal="true"
           aria-labelledby="resultado-titulo">
    <div class="resultado-simbolo" aria-hidden="true">✓</div>
    <h2 id="resultado-titulo">{{ resultado }}</h2>
    <button type="button" class="boton-movil" (click)="cerrarResultado()">
      Aceptar
    </button>
  </section>
</div>
