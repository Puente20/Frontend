<main class="egreso-wrapper">

  <!-- Encabezado -->
  <header class="header">

    <button
      type="button"
      class="btn-volver"
      (click)="volver()">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M25 0.5C38.531 0.5 49.5 11.469 49.5 25C49.5 38.531 38.531 49.5 25 49.5C11.469 49.5 0.5 38.531 0.5 25C0.5 11.469 11.469 0.5 25 0.5Z" fill="#2C2C2C"/>
<path d="M25 0.5C38.531 0.5 49.5 11.469 49.5 25C49.5 38.531 38.531 49.5 25 49.5C11.469 49.5 0.5 38.531 0.5 25C0.5 11.469 11.469 0.5 25 0.5Z" stroke="#2C2C2C" stroke-linecap="round"/>
<path d="M30.8333 25H19.1666M25 19.1667L19.1666 25L25 30.8333" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke="#F5F5F5"/>
</svg>

    </button>

    <img
      src="/logo-zentry-negro.png"
      alt="Zentry"
      class="logo">

  </header>

  <!-- Titulo principal -->
  <section class="titulo">

    <h1>Registrar egreso</h1>

    <p>
      Ingresá el DNI de todas las personas que salen del barrio.
    </p>

  </section>

  <!-- Formulario -->
  <form (ngSubmit)="aceptarEgreso()" novalidate>

    <!-- Tarjetas de personas -->
    <div
      class="persona-card"
      *ngFor="let dni of dnis; let i = index; trackBy: trackByIndex">

      <div class="persona-encabezado">

        <h2>Persona {{ i + 1 }}</h2>

        <!-- Eliminar persona -->
        <button
          *ngIf="i > 0"
          type="button"
          class="btn-eliminar"
          (click)="quitarPersona(i)">
          Eliminar
        </button>

      </div>

      <!-- Campo DNI -->
      <label [for]="'dni-' + i">
        DNI
      </label>

      <input
        [id]="'dni-' + i"
        [name]="'dni-' + i"
        type="text"
        inputmode="numeric"
        maxlength="8"
        placeholder="Ingresar DNI"
        [(ngModel)]="dnis[i]"
        (ngModelChange)="limpiarMensajes()">
      <p class="persona-nombre" *ngIf="obtenerNombre(dnis[i])">
        Nombre: {{ obtenerNombre(dnis[i]) }}
      </p>

    </div>

    <!-- Boton agregar persona -->
    <button
      type="button"
      class="btn-agregar"
      (click)="agregarPersona()">

      <span class="simbolo-mas">+</span>
      Agregar persona

    </button>

    <!-- Mensaje de error -->
    <p
      *ngIf="mensajeError"
      class="mensaje-error">

      {{ mensajeError }}

    </p>

    <!-- Mensaje de confirmacion -->
    <p
      *ngIf="mensajeExito"
      class="mensaje-exito">

      {{ mensajeExito }}

    </p>

    <!-- Boton aceptar -->
    <button
      type="submit"
      class="btn-aceptar"
      [disabled]="guardando">

      {{ guardando ? 'Registrando...' : 'Aceptar' }}

    </button>

  </form>

</main>
