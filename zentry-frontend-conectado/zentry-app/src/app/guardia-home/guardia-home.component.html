<main class="guardia-wrapper">

  <!-- Logo de Zentry -->
  <header class="header">
    <img src="/logo-zentry-negro.png" alt="Zentry" class="logo">
  </header>

  <!-- Titulo principal -->
  <section class="titulo">
    <h1>Panel del guardia</h1>
    <p>Control de ingresos y egresos</p>
  </section>

  <!-- Acciones principales -->
  <section class="acciones">

    <!-- Escanear QR -->
    <div class="tarjeta">
      <h2>Ingreso de visitantes</h2>

      <p>
        Escaneá el código QR del visitante para validar su ingreso.
      </p>

      <button type="button" (click)="irAEscanearQR()">
        Escanear QR de ingreso
      </button>
    </div>

    <!-- Registrar egreso -->
    <div class="tarjeta">
      <h2>Egreso de visitantes</h2>

      <p>
        Ingresá el DNI de cada persona que se retira del barrio.
      </p>

      <button type="button" (click)="irARegistrarEgreso()">
        Registrar egreso
      </button>
    </div>

  </section>

  <!-- Cerrar sesion -->
  <button
    type="button"
    class="btn-salir"
    (click)="cerrarSesion()">
    Cerrar sesión
  </button>

</main>
