<div class="recu-contra-Container">
  <div class="recu-contra-header">
    <img src="/logo-zentry-negro.png" alt="Zentry" class="zentry-logo" />
  </div>

  <form #formulario="ngForm" class="formulario" (ngSubmit)="enviarSolicitud(formulario)">
    <p>Ingresa tu correo y le notificaremos al administrador para restablecer tu contraseña.</p>
    <label for="email">Correo electrónico</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="correo"
      placeholder="ejemplo@correo.com"
      autocomplete="email"
      #emailControl="ngModel"
      email
      required />
    <button type="submit">Continuar</button>
    <button type="button" class="btn-volver" (click)="volveraAtras()">Volver</button>
    <span class="error" *ngIf="emailControl.invalid && emailControl.touched" role="alert">
      <ng-container *ngIf="emailControl.hasError('required'); else correoInvalido">
        Ingresa tu correo electrónico.
      </ng-container>
      <ng-template #correoInvalido>Ingresa un correo electrónico válido, por ejemplo nombre@dominio.com.</ng-template>
    </span>
    <p class="mensaje" *ngIf="mensaje" role="status">{{ mensaje }}</p>
  </form>
</div>
