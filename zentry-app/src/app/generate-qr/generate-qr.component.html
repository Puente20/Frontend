<div class="screen-container">
  <!-- Encabezado con botón de volver y logo de Zentry en la misma posición -->
  <header class="header">
    <button type="button" class="btn-back" (click)="volver()" aria-label="Volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>

    <div class="logo-wrapper">
      <img src="/logo-zentry-negro.png" alt="Zentry" class="zentry-logo" />
    </div>
  </header>

  <!-- Título y fecha -->
  <section class="title-section">
    <h1 class="main-title">Generar QR de invitación</h1>
    <p class="subtitle-date">Fecha, {{ fechaActual }}</p>
  </section>

  <!-- Selector de tipo de invitación -->
  <section class="type-section">
    <label class="section-label">Tipo de invitación</label>
    <div class="toggle-pill" [class.is-concurrent]="tipoInvitacion === 'concurrente'">
      <button
        type="button"
        class="toggle-option"
        [class.active]="tipoInvitacion === 'unica'"
        (click)="seleccionarTipo('unica')">
        Visita única
      </button>
      <button
        type="button"
        class="toggle-option"
        [class.active]="tipoInvitacion === 'concurrente'"
        (click)="seleccionarTipo('concurrente')">
        Visita recurrente
      </button>
    </div>
  </section>

  <!-- Tarjeta del formulario -->
  <form class="form-card" (ngSubmit)="generarQR()">
    <div class="form-group">
      <label for="nombreVisitante" class="input-label">Nombre del visitante</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="10" r="3"></circle>
          <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
        </svg>
        <input
          id="nombreVisitante"
          name="nombreVisitante"
          type="text"
          class="form-input"
          placeholder="Ej: Juan Martinez"
          [(ngModel)]="invitacion.nombreVisitante"
          required />
      </div>
    </div>

    <div class="form-group">
      <label for="dni" class="input-label">Documento Nacional de Identidad</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <circle cx="8" cy="10" r="2"></circle>
          <path d="M5 16c0-1.7 1.3-3 3-3s3 1.3 3 3"></path>
          <line x1="14" y1="10" x2="19" y2="10"></line>
          <line x1="14" y1="14" x2="19" y2="14"></line>
        </svg>
        <input
          id="dni"
          name="dni"
          type="text"
          inputmode="numeric"
          class="form-input"
          placeholder="Ej: 32456789"
          [(ngModel)]="invitacion.dni"
          required />
      </div>
    </div>

    <div class="form-group">
      <label for="porton" class="input-label">Portón habilitado</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 20V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v15"></path>
          <line x1="3" y1="20" x2="19" y2="20"></line>
          <circle cx="13.5" cy="12" r="0.8" fill="#000000"></circle>
        </svg>
        <input
          id="porton"
          name="porton"
          type="text"
          class="form-input"
          placeholder="Ej: Portón Principal"
          [(ngModel)]="invitacion.porton"
          required />
      </div>
    </div>
  </form>

  <!-- Botón principal -->
  <div class="footer-action">
    <button type="button" class="btn-generar" (click)="generarQR()">
      Generar QR
    </button>
  </div>
</div>
