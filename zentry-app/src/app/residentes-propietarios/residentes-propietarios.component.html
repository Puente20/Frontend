<div class="residentes-propietarios-wrapper">

  <!--Encabezado de Perfil de Administradora -->
  <header class="profile-header">
    <div class="avatar-circle">
      <img src="/minilogo-sfondo.png" alt="Logo Zentry" class="avatar-img" />
    </div>
    <div class="profile-info">
      <h2 class="admin-name">{{ adminNombre }}</h2>
      <p class="admin-role">{{ adminRol }}</p>
    </div>
  </header>

  <!-- Título Principal y Fecha / Barrio -->
  <section class="panel-heading">
    <h1 class="panel-title">Residentes</h1>
    <p class="panel-subtitle">
      Fecha, {{ fechaActual }} - <em>{{ nombreBarrio }}</em>
    </p>
  </section>

  <!-- Buscador por nombre o número de lote -->
  <section class="search-section" aria-label="Buscar propietario">
    <div class="search-pill">
      <svg
        class="search-icon"
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7.5" stroke="#000000" stroke-width="2" />
        <circle cx="10.5" cy="10.5" r="4.2" fill="#000000" />
        <line x1="16.2" y1="16.2" x2="21.5" y2="21.5" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
      </svg>

      <input
        id="buscar-propietario"
        name="terminoBusqueda"
        type="text"
        class="search-input"
        placeholder="Buscar por nombre o número de lote..."
        [(ngModel)]="terminoBusqueda"
        (ngModelChange)="onBuscarChange($event)"
        autocomplete="off"
        aria-label="Buscar propietario por nombre o número de lote" />

      <button
        *ngIf="terminoBusqueda.trim().length > 0"
        type="button"
        class="btn-clear-search"
        (click)="limpiarBusqueda()"
        aria-label="Limpiar búsqueda">
        ×
      </button>
    </div>
  </section>

  <!-- Selector Propietarios / Inquilinos -->
  <section class="role-toggle-section" aria-label="Filtro por tipo de residente">
    <div class="toggle-pill">
      <button
        type="button"
        class="toggle-option active"
        aria-current="page">
        Propietarios
      </button>
      <button
        type="button"
        class="toggle-option"
        (click)="irAInquilinos()">
        Inquilinos
      </button>
    </div>
  </section>

  <!-- Lista scrolleable de tarjetas de Propietarios -->
  <main class="residents-scroll-container" aria-label="Listado de propietarios">
    <!-- Estado de carga preparado para backend -->
    <div class="empty-state-card" *ngIf="cargando">
      <p class="empty-state-text">Cargando propietarios...</p>
    </div>

    <!-- Listado de tarjetas -->
    <div class="residents-list" *ngIf="!cargando && propietariosFiltrados.length > 0">
      <article
        class="resident-card"
        *ngFor="let propietario of propietariosFiltrados; trackBy: trackByPropietarioId">
        <div class="resident-card-left">
          <div class="resident-avatar" aria-hidden="true">
            <svg width="58" height="58" viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="29" cy="29" r="26.5" stroke="#000000" stroke-width="3.6" />
              <circle cx="29" cy="22" r="8.8" fill="#000000" />
              <path
                d="M12.5 47.8C15.5 39.8 21.5 35.8 29 35.8C36.5 35.8 42.5 39.8 45.5 47.8C41.1 52.3 35.4 55 29 55C22.6 55 16.9 52.3 12.5 47.8Z"
                fill="#000000" />
            </svg>
          </div>

          <div class="resident-info">
            <h3 class="resident-name">{{ propietario.nombre }}</h3>
            <p class="resident-lote">Lote {{ propietario.lote }}</p>
          </div>
        </div>

        <button
          type="button"
          class="btn-whatsapp"
          (click)="contactarPorWhatsapp(propietario, $event)"
          [attr.aria-label]="'Contactar por WhatsApp a ' + propietario.nombre">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M38.2 4.3C38.9 4.0 39.6 4.6 39.4 5.4L29.6 37.4C29.3 38.4 28.0 38.6 27.4 37.8L19.8 27.6L31.2 13.8C31.5 13.4 31.0 12.9 30.6 13.2L15.4 24.4L4.4 19.6C3.5 19.2 3.5 17.9 4.5 17.5L38.2 4.3Z"
              fill="#146C11" />
          </svg>
        </button>
      </article>
    </div>

    <!-- Sin resultados en la búsqueda -->
    <div class="empty-state-card" *ngIf="!cargando && propietariosFiltrados.length === 0">
      <p class="empty-state-text">
        No se encontraron propietarios para "{{ terminoBusqueda }}".
      </p>
    </div>
  </main>

  <!-- 6. Barra de Navegación Inferior (botón del medio activo) -->
  <nav class="bottom-nav-container" aria-label="Navegación principal">
    <div class="bottom-nav">

      <!-- Inicio -->
      <button
        type="button"
        class="nav-item"
        [class.active]="tabActiva === 'inicio'"
        (click)="cambiarTabNav('inicio')"
        aria-label="Inicio">
        <span class="nav-notch" *ngIf="tabActiva === 'inicio'"></span>
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3.2L3 10.8V20.2C3 20.64 3.36 21 3.8 21H9.5V14.5H14.5V21H20.2C20.64 21 21 20.64 21 20.2V10.8L12 3.2Z" />
          </svg>
        </span>
      </button>

      <!-- Residentes (Botón del medio activo) -->
      <button
        type="button"
        class="nav-item"
        [class.active]="tabActiva === 'residentes'"
        (click)="cambiarTabNav('residentes')"
        aria-label="Residentes">
        <span class="nav-notch" *ngIf="tabActiva === 'residentes'"></span>
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="7.5" r="4.2" />
            <path d="M4.5 20.2C4.5 16.2 7.8 13.5 12 13.5C16.2 13.5 19.5 16.2 19.5 20.2H4.5Z" />
          </svg>
        </span>
      </button>

      <!-- Ajustes -->
      <button
        type="button"
        class="nav-item"
        [class.active]="tabActiva === 'ajustes'"
        (click)="cambiarTabNav('ajustes')"
        aria-label="Configuración">
        <span class="nav-notch" *ngIf="tabActiva === 'ajustes'"></span>
        <span class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M10.4 2.2C10.6 1.7 11.1 1.4 11.6 1.4H12.4C12.9 1.4 13.4 1.7 13.6 2.2L14.2 3.8C14.8 4.0 15.3 4.3 15.8 4.7L17.5 4.1C18.0 3.9 18.5 4.1 18.8 4.5L19.4 5.2C19.7 5.6 19.8 6.2 19.5 6.6L18.5 8.1C18.8 8.6 19.0 9.2 19.1 9.8L20.7 10.4C21.2 10.6 21.5 11.1 21.5 11.6V12.4C21.5 12.9 21.2 13.4 20.7 13.6L19.1 14.2C19.0 14.8 18.8 15.4 18.5 15.9L19.5 17.4C19.8 17.8 19.7 18.4 19.4 18.8L18.8 19.5C18.5 19.9 18.0 20.1 17.5 19.9L15.8 19.3C15.3 19.7 14.8 20.0 14.2 20.2L13.6 21.8C13.4 22.3 12.9 22.6 12.4 22.6H11.6C11.1 22.6 10.6 22.3 10.4 21.8L9.8 20.2C9.2 20.0 8.7 19.7 8.2 19.3L6.5 19.9C6.0 20.1 5.5 19.9 5.2 19.5L4.6 18.8C4.3 18.4 4.2 17.8 4.5 17.4L5.5 15.9C5.2 15.4 5.0 14.8 4.9 14.2L3.3 13.6C2.8 13.4 2.5 12.9 2.5 12.4V11.6C2.5 11.1 2.8 10.6 3.3 10.4L4.9 9.8C5.0 9.2 5.2 8.6 5.5 8.1L4.5 6.6C4.2 6.2 4.3 5.6 4.6 5.2L5.2 4.5C5.5 4.1 6.0 3.9 6.5 4.1L8.2 4.7C8.7 4.3 9.2 4.0 9.8 3.8L10.4 2.2ZM12 15.2C13.77 15.2 15.2 13.77 15.2 12C15.2 10.23 13.77 8.8 12 8.8C10.23 8.8 8.8 10.23 8.8 12C8.8 13.77 10.23 15.2 12 15.2Z" />
          </svg>
        </span>
      </button>

    </div>
  </nav>

</div>
