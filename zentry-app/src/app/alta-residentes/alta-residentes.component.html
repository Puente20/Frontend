<div class="alta-residentes-wrapper">

  <!--Encabezado de Perfil de Administradora -->
  <header class="profile-header">
    <div class="avatar-circle">
      <img src="/minilogo-sfondo.png" alt="Logo Zentry" class="avatar-img" />
    </div>
    <div class="profile-info">
      <h2 class="admin-name">{{ adminNombre }}</h2>
      <p class="admin-role">{{ adminRol }}</p>
    </div>
  </header>

  <!--Título Principal y Fecha / Barrio -->
  <section class="panel-heading">
    <h1 class="panel-title">Alta de residentes</h1>
    <p class="panel-subtitle">
      Fecha, {{ fechaActual }} - <em>{{ nombreBarrio }}</em>
    </p>
  </section>

  <!-- Selector Propietario / Inquilino -->
  <section class="role-toggle-section" aria-label="Tipo de residente">
    <div class="toggle-pill" [class.is-inquilino]="tipoResidente === 'inquilino'">
      <button
        type="button"
        class="toggle-option"
        [class.active]="tipoResidente === 'propietario'"
        (click)="seleccionarTipoResidente('propietario')">
        Propietario
      </button>
      <button
        type="button"
        class="toggle-option"
        [class.active]="tipoResidente === 'inquilino'"
        (click)="seleccionarTipoResidente('inquilino')">
        Inquilino
      </button>
    </div>
  </section>

  <!-- Tarjeta de Datos Personales -->
  <form class="form-card" (ngSubmit)="darAlta()" novalidate>
    <h2 class="card-section-title">Datos personales</h2>

    <!-- Nombre -->
    <div class="form-group">
      <label for="nombre" class="input-label">Nombre</label>
      <input
        id="nombre"
        name="nombre"
        type="text"
        class="pill-input"
        [(ngModel)]="residente.nombre"
        autocomplete="given-name"
        required />
    </div>

    <!-- Apellido -->
    <div class="form-group">
      <label for="apellido" class="input-label">Apellido</label>
      <input
        id="apellido"
        name="apellido"
        type="text"
        class="pill-input"
        [(ngModel)]="residente.apellido"
        autocomplete="family-name"
        required />
    </div>

    <!-- DNI -->
    <div class="form-group">
      <label for="dni" class="input-label">DNI</label>
      <input
        id="dni"
        name="dni"
        type="text"
        inputmode="numeric"
        class="pill-input"
        [(ngModel)]="residente.dni"
        required />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email" class="input-label">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        class="pill-input"
        [(ngModel)]="residente.email"
        autocomplete="email"
        required />
    </div>

    <!-- Teléfono celular -->
    <div class="form-group">
      <label for="telefono" class="input-label">Teléfono celular</label>
      <input
        id="telefono"
        name="telefono"
        type="tel"
        inputmode="tel"
        class="pill-input"
        [(ngModel)]="residente.telefono"
        autocomplete="tel"
        required />
    </div>

    <!-- Asignación de lote (1 al 100 con búsqueda que posiciona el número arriba de todo) -->
    <div class="form-group lote-select-container">
      <label for="asignacionLote" class="input-label">Asignación de lote</label>
      <div class="lote-input-pill" [class.dropdown-open]="listaLotesAbierta">
        <input
          id="asignacionLote"
          name="asignacionLote"
          type="text"
          class="lote-text-input"
          [ngModel]="loteFiltro"
          (ngModelChange)="onLoteInputChange($event)"
          (focus)="onFocusLote()"
          autocomplete="off"
          aria-expanded="{{ listaLotesAbierta }}"
          aria-controls="lotes-listbox"
          required />

        <button
          type="button"
          class="btn-circle-chevron"
          [class.rotated]="listaLotesAbierta"
          (click)="toggleListaLotes($event)"
          aria-label="Desplegar lista de lotes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="#2C2C2C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Lista desplegable de lotes (1 al 100) -->
      <ul
        *ngIf="listaLotesAbierta"
        #lotesDropdownList
        id="lotes-listbox"
        class="lotes-dropdown"
        role="listbox"
        aria-label="Lista de lotes del 1 al 100">
        <li
          *ngFor="let lote of lotesOrdenados"
          role="option"
          class="lote-option"
          [class.top-match]="numeroLoteDestacado === lote"
          [class.selected]="residente.lote === ('' + lote)"
          [attr.aria-selected]="residente.lote === ('' + lote)"
          (click)="seleccionarLote(lote)">
          <span class="lote-option-label">Lote {{ lote }}</span>
          <span *ngIf="numeroLoteDestacado === lote" class="lote-match-badge">#{{ lote }}</span>
        </li>
      </ul>
    </div>

    <!-- Patente/s (dinámico con botón '+' permanente para agregar más de 2 autos) -->
    <div class="form-group patentes-group">
      <label for="patente-0" class="input-label">Patente/s</label>

      <div class="patentes-list">
        <div
          class="patente-row"
          *ngFor="let patente of patentes; let i = index; trackBy: trackByIndex">
          <input
            [id]="'patente-' + i"
            [name]="'patente-' + i"
            type="text"
            class="pill-input patente-input"
            [(ngModel)]="patentes[i]"
            autocomplete="off" />

          <!-- El botón '+' permanece siempre visible para agregar todos los campos necesarios -->
          <button
            *ngIf="i === 0"
            type="button"
            class="btn-circle-plus"
            (click)="agregarPatente()"
            aria-label="Agregar otra patente">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="12" y1="6" x2="12" y2="18" stroke="#2C2C2C" stroke-width="2.3" stroke-linecap="round"/>
              <line x1="6" y1="12" x2="18" y2="12" stroke="#2C2C2C" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </button>

          <button
            *ngIf="i > 0"
            type="button"
            class="btn-circle-plus"
            (click)="quitarPatente(i)"
            [attr.aria-label]="'Eliminar patente ' + (i + 1)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="6" y1="12" x2="18" y2="12" stroke="#2C2C2C" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Botones de Acción (Cancelar / Dar alta) al final del scroll -->
    <div class="form-actions">
      <button
        type="button"
        class="btn-cancelar"
        (click)="cancelar()">
        Cancelar
      </button>

      <button
        type="submit"
        class="btn-dar-alta">
        Dar alta
      </button>
    </div>
  </form>

</div>
