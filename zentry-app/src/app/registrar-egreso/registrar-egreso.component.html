<main class="egreso-wrapper">

  <!-- Encabezado -->
  <header class="header">

    <button
      type="button"
      class="btn-volver"
      (click)="volver()">
      ← Volver
    </button>

    <img
      src="/logo-zentry-negro.png"
      alt="Zentry"
      class="logo">

  </header>

  <!-- Titulo principal -->
  <section class="titulo">

    <h1>Registrar egreso</h1>

    <p>
      Ingresá el DNI de todas las personas que salen del barrio.
    </p>

  </section>

  <!-- Formulario -->
  <form (ngSubmit)="aceptarEgreso()" novalidate>

    <!-- Tarjetas de personas -->
    <div
      class="persona-card"
      *ngFor="let dni of dnis; let i = index; trackBy: trackByIndex">

      <div class="persona-encabezado">

        <h2>Persona {{ i + 1 }}</h2>

        <!-- Eliminar persona -->
        <button
          *ngIf="i > 0"
          type="button"
          class="btn-eliminar"
          (click)="quitarPersona(i)">
          Eliminar
        </button>

      </div>

      <!-- Campo DNI -->
      <label [for]="'dni-' + i">
        DNI
      </label>

      <input
        [id]="'dni-' + i"
        [name]="'dni-' + i"
        type="text"
        inputmode="numeric"
        maxlength="8"
        placeholder="Ingresar DNI"
        [(ngModel)]="dnis[i]"
        (ngModelChange)="limpiarMensajes()">

    </div>

    <!-- Boton agregar persona -->
    <button
      type="button"
      class="btn-agregar"
      (click)="agregarPersona()">

      <span class="simbolo-mas">+</span>
      Agregar persona

    </button>

    <!-- Mensaje de error -->
    <p
      *ngIf="mensajeError"
      class="mensaje-error">

      {{ mensajeError }}

    </p>

    <!-- Mensaje de confirmacion -->
    <p
      *ngIf="mensajeExito"
      class="mensaje-exito">

      {{ mensajeExito }}

    </p>

    <!-- Boton aceptar -->
    <button
      type="submit"
      class="btn-aceptar">

      Aceptar

    </button>

  </form>

</main>
