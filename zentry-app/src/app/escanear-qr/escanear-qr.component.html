<main class="qr-wrapper">

  <!-- Encabezado -->
  <header class="header">

    <button
      type="button"
      class="btn-volver"
      (click)="volver()">
      ← Volver
    </button>

    <img
      src="/logo-zentry-negro.png"
      alt="Zentry"
      class="logo">

  </header>

  <!-- Titulo principal -->
  <section class="titulo">

    <h1>Escanear QR de ingreso</h1>

    <p>
      Enfocá el código QR del visitante dentro del recuadro.
    </p>

  </section>

  <!-- Espacio de la camara -->
  <section class="camara">

    <div class="marco-qr"></div>

  </section>

  <!-- Instrucciones -->
  <p class="mensaje">
    Colocá el código QR en el centro para poder escanearlo.
  </p>

  <p class="aviso">
    La cámara todavía no está habilitada.
  </p>

</main>
